# default prior for use with `IMRPhenomPv2`
class_path: amplfi.train.data.utils.utils.ParameterSampler
init_args:
  parameters:
    frequency:
      class_path: torch.distributions.Uniform
      init_args:
        low: 32
        high: 1024
        validate_args: false
    quality:
      class_path: torch.distributions.Uniform
      init_args:
        low: 25
        high: 75
        validate_args: false
    hrss:
      class_path: ml4gw.distributions.Uniform
      init_args:
        low: 1e-21
        high: 2e-21
        validate_args: false
    phase:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0
        high: 6.28318 
        validate_args: false
    eccentricity:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0
        high: 0.01
        validate_args: false

# lightning.pytorch==2.1.3
seed_everything: 101588
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  profiler: "simple"
  logger:
    - class_path: lightning.pytorch.loggers.WandbLogger
      init_args:
        save_dir: ${oc.env:AMPLFI_OUTDIR}/train
        project: amplfi
        # uncomment and set to name your run
        # name:
  max_epochs: 800
  check_val_every_n_epoch: 1
  log_every_n_steps: 20
  benchmark: false
  callbacks: ./callbacks.yaml
model:
  class_path: amplfi.train.models.diffusion.DiffusionModel
  init_args:
    outdir: ${oc.env:AMPLFI_OUTDIR}
    samples_per_event: 10000
    arch:
      class_path: amplfi.train.architectures.DDPM
      init_args:
        hidden_features: 256
        num_blocks: 4
        time_embed_dim: 128
        num_timesteps: 1000
        # fewer sampling steps trade posterior fidelity for
        # faster inference via DDIM; defaults to num_timesteps
        sampling_timesteps: 100
        eta: 1.0
        # uncomment below to load
        # in pre-trained embedding weights
        # embedding_weights: "path/to/embedding/weights"
        # freeze_embedding: false
        embedding_net:
          class_path: amplfi.train.architectures.embeddings.ResNet
          init_args:
            context_dim: 5
            layers: [5, 3, 3]
            norm_layer:
              class_path: ml4gw.nn.norm.GroupNorm1DGetter
              init_args:
                groups: 16
    learning_rate: 3.77e-4
    pct_start: 0.1
    weight_decay: 0.0
data:
  class_path: amplfi.train.data.datasets.FlowDataset
  init_args:
    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0
        high: 3.14
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14
        high: 3.14
    data_dir: ${oc.env:AMPLFI_DATADIR}
    # only event-level summary parameters are inference targets:
    # individual sine-Gaussian components are unordered and vary in
    # count, so they're not well-posed targets for the model. Their
    # nuisance parameters (frequency, quality, phase, eccentricity,
    # shifts) are sampled inside the waveform_sampler below instead.
    inference_params: ["n_components", "hrss_tot", "dec", "psi", "phi"]
    parameter_transformer: amplfi.train.prior.multi_sg_transformer
    highpass: 25
    sample_rate: 2048
    kernel_length: 5
    fduration: 2
    psd_length: 12
    fftlength: 2
    batches_per_epoch: 200
    batch_size: 512
    ifos: ["H1", "L1"]
    min_valid_duration: 10000.0
    waveform_sampler:
      class_path: amplfi.train.data.waveforms.generator.multi.MultiWFGenerator
      init_args:
        # NOTE: per-component nuisance priors (frequency, quality, phase,
        # eccentricity, shifts, hrss_concentration) previously lived here
        # but don't match MultiWFGenerator's constructor and have been
        # dropped. They need to be reintroduced -- likely as per-component
        # entries in training_prior.priors below, consumed via a
        # conversion_function/parameter_transformer -- once
        # ml4gw.waveforms.MultiWaveform (and its expected `generator`
        # component) exist. `amplfi.train.prior.multi_sg_transformer`,
        # referenced below as parameter_transformer, also does not exist
        # yet and needs to be implemented.
        generator:
          # TODO: adjust once ml4gw.waveforms.MultiWaveform lands; this
          # assumes MultiWaveform instantiates `generator` itself using
          # the sample_rate/duration below (duration = fduration +
          # kernel_length = 2 + 5 = 7, matching this file's data config).
          class_path: ml4gw.waveforms.SineGaussian
          init_args:
            sample_rate: 2048
            duration: 7
        norm: true
        num_fit_params: 100000
        num_test_waveforms: 1000
        num_val_waveforms: 10000
        testing_prior: null
        training_prior:
          class_path: amplfi.train.prior.AmplfiMultiWFPrior
          init_args:
            n_wf:
              class_path: torch.distributions.Uniform
              init_args:
                low: 1
                high: 5
            priors:
              hrss_tot:
                class_path: ml4gw.distributions.LogUniform
                init_args:
                  low: 1e-23
                  high: 5e-20

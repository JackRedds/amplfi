# lightning.pytorch==2.1.3
seed_everything: 101588
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  profiler: "simple"
  logger:
    - class_path: lightning.pytorch.loggers.WandbLogger
      init_args:
        save_dir: ${oc.env:AMPLFI_OUTDIR}/train
        project: amplfi
        # uncomment and set to name your run
        # name:
  max_epochs: 800
  check_val_every_n_epoch: 1
  log_every_n_steps: 20
  benchmark: false
  callbacks: ./callbacks.yaml
model:
  class_path: amplfi.train.models.flow.FlowModel
  init_args:
    train_outdir: ${oc.env:AMPLFI_OUTDIR}
    samples_per_event: 10000
    arch:
      class_path: amplfi.train.architectures.NSF
      init_args:
        hidden_features: [512, 512, 512]
        transforms: 20
        randperm: true
        # uncomment below to load
        # in pre-trained embedding weights
        # embedding_weights: "path/to/embedding/weights"
        # freeze_embedding: false
        embedding_net:
          class_path: amplfi.train.architectures.embeddings.ResNet
          init_args:
            context_dim: 5
            layers: [5, 3, 3]
            norm_layer:
              class_path: ml4gw.nn.norm.GroupNorm1DGetter
              init_args:
                groups: 16
    learning_rate: 3.77e-4
    pct_start: 0.1
    weight_decay: 0.0
data:
  class_path: amplfi.train.data.datasets.FlowDataset
  init_args:
    dec:
      class_path: ml4gw.distributions.Cosine
    psi:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0
        high: 3.14
    phi:
      class_path: torch.distributions.Uniform
      init_args:
        low: -3.14
        high: 3.14
    data_dir: ${oc.env:AMPLFI_DATADIR}
    # event-level parameters. The individual sine-Gaussian components
    # are unordered and vary in count, so here they're nuisance
    # parameters; see multi_sg_slots.yaml (flow) to also infer them
    inference_params: ["n_components", "hrss_tot", "dec", "psi", "phi"]
    parameter_transformer: amplfi.train.prior.multi_sg_transformer
    highpass: 25
    sample_rate: 2048
    kernel_length: 5
    fduration: 2
    psd_length: 12
    fftlength: 2
    batches_per_epoch: 200
    batch_size: 512
    ifos: ["H1", "L1"]
    min_valid_duration: 10000.0
    waveform_sampler:
      class_path: amplfi.train.data.waveforms.generator.multi.MultiWFGenerator
      init_args:
        generator:
          # sample_rate and duration (fduration + kernel_length) are
          # supplied by MultiWFGenerator from the data config
          class_path: ml4gw.waveforms.SineGaussian
        # rescale the summed components to hrss_tot
        norm: true
        num_fit_params: 100000
        num_test_waveforms: 1000
        num_val_waveforms: 10000
        testing_prior: null
        training_prior:
          class_path: amplfi.train.prior.AmplfiMultiWFPrior
          init_args:
            # samples are cast to integers, so this gives 1-4 components
            n_wf:
              class_path: torch.distributions.Uniform
              init_args:
                low: 1
                high: 5
            conversion_function: amplfi.train.prior.multi_sg_conversion
            # per-component priors
            priors:
              frequency:
                class_path: torch.distributions.Uniform
                init_args:
                  low: 32
                  high: 1024
              quality:
                class_path: torch.distributions.Uniform
                init_args:
                  low: 2
                  high: 100
              # with norm: true, only the relative component
              # amplitudes (hrss_frac) matter
              hrss:
                class_path: ml4gw.distributions.LogUniform
                init_args:
                  low: 1e-23
                  high: 5e-20
              phase:
                class_path: torch.distributions.Uniform
                init_args:
                  low: 0
                  high: 6.283
              eccentricity:
                class_path: torch.distributions.Uniform
                init_args:
                  low: 0
                  high: 1
              # time offset (s) of each component from the kernel center
              shifts:
                class_path: torch.distributions.Uniform
                init_args:
                  low: -0.1
                  high: 0.1
            event_priors:
              hrss_tot:
                class_path: ml4gw.distributions.LogUniform
                init_args:
                  low: 1e-23
                  high: 5e-20

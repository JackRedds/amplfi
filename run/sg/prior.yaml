# default prior for use with `IMRPhenomPv2`
class_path: amplfi.train.data.utils.utils.ParameterSampler
init_args:
  conversion_function: amplfi.train.conversion.precessing_to_lalsimulation_parameters
  parameters:
    frequency:
      class_path: torch.distributions.Uniform
      init_args:
        low: 32
        high: 1024
        validate_args: false
    quality:
      class_path: torch.distributions.Uniform
      init_args:
        low: 2
        high: 100
        validate_args: false
    hrss:
      class_path: ml4gw.distributions.LogUniform
      init_args:
        low: 32
        high: 1024
        validate_args: false
    phase:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0
        high: 6.28318 
        validate_args: false
    eccentricity:
      class_path: torch.distributions.Uniform
      init_args:
        low: 0
        high: 1
        validate_args: false
